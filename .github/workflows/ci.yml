# Build verification on every push / PR. Same publish path as a release, but
# x64 only and no artifacts are kept — this is a "does it still compile and
# start" gate, not a release build.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Warnings as errors here but NOT in build.ps1: a release build should
      # not fail on a new SDK's new warning, but a PR should surface it.
      - name: Build (warnings as errors)
        run: dotnet build src/jrdp.csproj -c Debug -warnaserror -nologo

      - name: Publish (single-file, self-contained)
        shell: pwsh
        run: ./build.ps1 -Arch x64 -Version 0.0.0-ci

      # The published bundle must actually start. --version and --help are the
      # only paths that neither open a window nor need an RDP server.
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = 'dist/jrdp-win-x64.exe'

          $version = (& $exe --version 2>&1 | Out-String).Trim()
          Write-Host "--version -> $version"
          if ($LASTEXITCODE -ne 0) { throw "--version exited $LASTEXITCODE" }

          $help = (& $exe --help 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "--help exited $LASTEXITCODE" }
          if ($help -notmatch '--stdio') { throw '--help output missing --stdio' }

          # An unknown argument must fail loudly rather than silently opening
          # the connect dialog.
          & $exe --definitely-not-an-option 2>&1 | Out-Null
          $badArgExit = $LASTEXITCODE
          if ($badArgExit -eq 0) { throw 'unknown argument should exit non-zero' }

          # Reset $LASTEXITCODE: the Actions pwsh shell appends an implicit
          # `exit $LASTEXITCODE`, so leaving the expected non-zero code from
          # the check above would fail the step even though every assertion
          # passed.
          $global:LASTEXITCODE = 0

          Write-Host "unknown argument -> exit $badArgExit (expected non-zero)"
          Write-Host 'smoke test OK'

      # Drives the real stdin/stdout protocol: the helper must report its HWND,
      # become ready, and exit cleanly on `quit`. This is the contract an
      # embedding host depends on, so a regression here is a breaking change.
      - name: Stdio protocol test
        shell: pwsh
        timeout-minutes: 3
        run: |
          $exe = Resolve-Path 'dist/jrdp-win-x64.exe'
          $out = "{`"type`":`"quit`"}" | & $exe --stdio 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch '"type":"hwnd"')    { throw 'no hwnd event' }
          if ($out -notmatch '"type":"ready"')   { throw 'no ready event' }
          if ($out -notmatch '"type":"exiting"') { throw 'no exiting event' }
          if ($LASTEXITCODE -ne 0) { throw "jrdp --stdio exited $LASTEXITCODE" }
          Write-Host 'stdio protocol OK'

      # The .rdp / rdp:// parsers are what the Windows registry integration
      # feeds (docs/windows-integration.md), so they need to keep working.
      # --print-config resolves the input without connecting.
      - name: Input parsing test (.rdp files and rdp:// URIs)
        shell: pwsh
        run: |
          $exe = 'dist/jrdp-win-x64.exe'

          function Check($label, $out, $expected) {
            foreach ($e in $expected) {
              if ($out -notmatch $e) {
                Write-Host $out
                throw "$label : expected /$e/"
              }
            }
            Write-Host "  ok: $label"
          }

          # A .rdp file in the format mstsc actually writes, including the
          # DPAPI password blob (which must be ignored, not parsed).
          @'
          full address:s:srv01.corp.example:3390
          username:s:CORP\azdolinski
          domain:s:CORP
          audiomode:i:2
          redirectclipboard:i:0
          drivestoredirect:s:*
          password 51:b:01000000D08C9DDF0115D1118C7A00C04FC297EB
          '@ -split "`n" | ForEach-Object { $_.Trim() } | Set-Content test.rdp

          # Single-quoted patterns: PowerShell does no escape processing, so
          # '\\' reaches the regex engine as an escaped literal backslash.
          Check '.rdp file' (& $exe test.rdp --print-config | Out-String) @(
            'host\s+srv01\.corp\.example', 'port\s+3390',
            'username\s+CORP\\azdolinski', 'audioMode\s+2',
            'redirectClipboard\s+False', 'redirectDrives\s+True',
            'password\s+\(none\)'   # the b: blob must NOT become a password
          )

          Check 'flags override the file' (& $exe test.rdp --port 3999 --no-drives --print-config | Out-String) @(
            'port\s+3999', 'redirectDrives\s+False'
          )

          Check 'rdp:// authority form' (& $exe 'rdp://srv02:3391' --print-config | Out-String) @(
            'host\s+srv02', 'port\s+3391'
          )

          # The exact shape Windows passes a protocol handler: it inserts a
          # "/" before the query string.
          Check 'rdp:// as Windows passes it' (& $exe 'rdp://CORP%5Cme@srv03:3392/?redirectclipboard=0' --print-config | Out-String) @(
            'host\s+srv03', 'port\s+3392', 'username\s+me', 'domain\s+CORP',
            'redirectClipboard\s+False'
          )

          Check 'rdp:// Microsoft setting form' (& $exe 'rdp://full%20address=s:srv04:3393&username=s:bob' --print-config | Out-String) @(
            'host\s+srv04', 'port\s+3393', 'username\s+bob'
          )

          # A password in a URI must be ignored: URIs leak into history/logs.
          Check 'URI password ignored' (& $exe 'rdp://me:secret@srv05' --print-config | Out-String) @(
            'username\s+me', 'password\s+\(none\)'
          )

          # Bad input must fail loudly rather than opening a dialog.
          & $exe 'rdp://' --print-config 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'empty rdp:// URI should fail' }
          & $exe missing.rdp --print-config 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'missing .rdp file should fail' }
          $global:LASTEXITCODE = 0

          Write-Host 'input parsing OK'
